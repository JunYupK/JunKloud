# Pinned, checksum-verified artifact versions for the reproducible Linux
# dev/workspace environment (runtime/Dockerfile, runtime/compose.yaml).
#
# Every checksum below was independently verified on 2026-10-14 by streaming
# the published artifact over HTTPS and computing its SHA-256 locally, then
# cross-checked against the upstream project's own published checksum file
# where one exists. `docker_cli` has no provenance note because
# download.docker.com does not publish a standalone checksum file for the
# static CLI tarballs; its checksums are self-computed from the artifact at
# the `source` URL below and have no independent upstream value to compare
# against.
#
# Do not bump a version here without re-running that verification and
# updating runtime/Dockerfile's matching ARG defaults in the same change.
