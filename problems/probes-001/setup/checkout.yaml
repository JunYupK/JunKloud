apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: ${namespace}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
      - name: web
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - sleep 10; mkdir -p /www; printf checkout-ok > /www/index.html; printf ok > /www/healthz; printf ok > /www/ready; exec httpd -f -p 8080 -h /www
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 2
          failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: ${namespace}
spec:
  selector:
    app: checkout
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
