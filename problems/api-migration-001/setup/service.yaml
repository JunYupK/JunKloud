{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "inventory",
    "namespace": "${namespace}"
  },
  "spec": {
    "selector": {
      "app": "inventory",
      "tier": "api"
    },
    "ports": [
      {
        "name": "http",
        "port": 80,
        "targetPort": 8080,
        "protocol": "TCP"
      }
    ]
  }
}
