apiVersion: v1
kind: Namespace
metadata:
  name: ${namespace}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ${namespace}
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-01-01T00:00:00Z"
    spec:
      containers:
      - name: gateway
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - mkdir -p /www && echo gateway-ok > /www/index.html && exec httpd -f -p 8080 -h /www
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: www
          mountPath: /www
      volumes:
      - name: www
        emptyDir: {}
