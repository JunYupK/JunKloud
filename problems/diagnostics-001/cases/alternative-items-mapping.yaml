apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: ${namespace}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: app
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - 'if [ ! -f /etc/orders/app.conf ]; then echo "FATAL: /etc/orders/app.conf not found (mounted: $(ls /etc/orders))"; exit 1; fi; ep=$(cat /etc/orders/app.conf); echo "orders started $ep"; mkdir -p /www; echo "orders-ok $ep" > /www/index.html; exec httpd -f -p 8080 -h /www'
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: config
          mountPath: /etc/orders
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: orders-config
          items:
          - key: orders.conf
            path: app.conf
