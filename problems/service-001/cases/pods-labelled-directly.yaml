apiVersion: v1
kind: Pod
metadata:
  name: catalog-orphan-1
  namespace: ${namespace}
  labels:
    app: catalog-api
    tier: backend
spec:
  containers:
  - name: catalog
    image: docker.io/library/busybox:1.37.0
    imagePullPolicy: Never
    command:
    - sh
    - -c
    - mkdir -p /www && printf catalog-ok > /www/index.html && exec httpd -f -p 8080 -h /www
    ports:
    - name: http
      containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: catalog-orphan-2
  namespace: ${namespace}
  labels:
    app: catalog-api
    tier: backend
spec:
  containers:
  - name: catalog
    image: docker.io/library/busybox:1.37.0
    imagePullPolicy: Never
    command:
    - sh
    - -c
    - mkdir -p /www && printf catalog-ok > /www/index.html && exec httpd -f -p 8080 -h /www
    ports:
    - name: http
      containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ${namespace}
spec:
  type: NodePort
  selector:
    app: catalog-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
    nodePort: 30080
