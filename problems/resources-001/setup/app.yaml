apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: ${namespace}
spec:
  hard:
    requests.cpu: 500m
    limits.cpu: "1"
    requests.memory: 256Mi
    limits.memory: 512Mi
    pods: "4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ${namespace}
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - sleep 3600
