apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ${namespace}
  labels:
    app: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
        tier: backend
    spec:
      containers:
      - name: catalog
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - mkdir -p /www && printf catalog-ok > /www/index.html && exec httpd -f -p 8080 -h /www
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
