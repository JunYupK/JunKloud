{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "relay",
    "namespace": "${namespace}"
  },
  "spec": {
    "restartPolicy": "Always",
    "initContainers": [
      {
        "name": "seed",
        "image": "docker.io/library/busybox:1.37.0",
        "imagePullPolicy": "Never",
        "command": [
          "sh",
          "-c",
          "exit 0"
        ],
        "resources": {
          "requests": {
            "cpu": "10m",
            "memory": "8Mi"
          },
          "limits": {
            "cpu": "75m",
            "memory": "32Mi"
          }
        },
        "volumeMounts": [
          {
            "name": "shared",
            "mountPath": "/work"
          }
        ]
      }
    ],
    "containers": [
      {
        "name": "app",
        "image": "docker.io/library/busybox:1.37.0",
        "imagePullPolicy": "Never",
        "command": [
          "sh",
          "-c",
          "echo delivered:seeded; sleep 3600"
        ],
        "resources": {
          "requests": {
            "cpu": "10m",
            "memory": "8Mi"
          },
          "limits": {
            "cpu": "75m",
            "memory": "32Mi"
          }
        },
        "volumeMounts": [
          {
            "name": "shared",
            "mountPath": "/work"
          }
        ]
      },
      {
        "name": "sidecar",
        "image": "docker.io/library/busybox:1.37.0",
        "imagePullPolicy": "Never",
        "command": [
          "sh",
          "-c",
          "sleep 3600"
        ],
        "resources": {
          "requests": {
            "cpu": "10m",
            "memory": "8Mi"
          },
          "limits": {
            "cpu": "75m",
            "memory": "32Mi"
          }
        },
        "volumeMounts": [
          {
            "name": "shared",
            "mountPath": "/work"
          }
        ]
      }
    ],
    "volumes": [
      {
        "name": "shared",
        "emptyDir": {}
      }
    ]
  }
}
