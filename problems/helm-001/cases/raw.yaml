{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "parcel-web",
    "namespace": "${namespace}"
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "app": "parcel"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "parcel"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "web",
            "image": "docker.io/library/busybox:1.37.0",
            "imagePullPolicy": "Never",
            "command": [
              "sh",
              "-c",
              "printf \"message=%s\\n\" \"$MESSAGE\"; exec sleep 3600"
            ],
            "env": [
              {
                "name": "MESSAGE",
                "value": "parcel-ready"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "8Mi"
              },
              "limits": {
                "cpu": "100m",
                "memory": "32Mi"
              }
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-c",
                  "true"
                ]
              },
              "periodSeconds": 1
            }
          }
        ]
      }
    }
  }
}
