{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "relay",
    "namespace": "${namespace}"
  },
  "spec": {
    "restartPolicy": "Always",
    "initContainers": [
      {
        "name": "seed",
        "image": "docker.io/library/busybox:1.37.0",
        "imagePullPolicy": "Never",
        "command": [
          "sh",
          "-c",
          "printf \"seeded\\n\" > /work/source; ln -s source /work/message"
        ],
        "resources": {
          "requests": {
            "cpu": "10m",
            "memory": "8Mi"
          },
          "limits": {
            "cpu": "75m",
            "memory": "32Mi"
          }
        },
        "volumeMounts": [
          {
            "name": "shared",
            "mountPath": "/work"
          }
        ]
      }
    ],
    "containers": [
      {
        "name": "app",
        "image": "docker.io/library/busybox:1.37.0",
        "imagePullPolicy": "Never",
        "command": [
          "sh",
          "-c",
          "while true; do if [ -f /work/ack ]; then cat /work/ack; else echo awaiting-data; fi; sleep 1; done"
        ],
        "resources": {
          "requests": {
            "cpu": "10m",
            "memory": "8Mi"
          },
          "limits": {
            "cpu": "75m",
            "memory": "32Mi"
          }
        },
        "volumeMounts": [
          {
            "name": "shared",
            "mountPath": "/work"
          }
        ]
      },
      {
        "name": "sidecar",
        "image": "docker.io/library/busybox:1.37.0",
        "imagePullPolicy": "Never",
        "command": [
          "sh",
          "-c",
          "while true; do if [ -f /work/message ]; then echo \"delivered:$(cat /work/message)\" > /work/ack; fi; sleep 1; done"
        ],
        "resources": {
          "requests": {
            "cpu": "10m",
            "memory": "8Mi"
          },
          "limits": {
            "cpu": "75m",
            "memory": "32Mi"
          }
        },
        "volumeMounts": [
          {
            "name": "shared",
            "mountPath": "/work"
          }
        ]
      }
    ],
    "volumes": [
      {
        "name": "shared",
        "emptyDir": {
          "sizeLimit": "8Mi"
        }
      }
    ]
  }
}
