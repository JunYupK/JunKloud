{
  "schema_version": 1,
  "id": "access-001",
  "version": "1.0.0",
  "title": "Give a ServiceAccount least-privilege access with namespaced RBAC",
  "domain": "environment-security",
  "difficulty": "medium",
  "type": "modify",
  "tags": [
    "environment-security",
    "rbac",
    "serviceaccount"
  ],
  "competencies": [
    "authentication and authorization",
    "ServiceAccount"
  ],
  "capabilities": [],
  "parameters": {
    "namespace": [
      "jk-access-001-a",
      "jk-access-001-b"
    ]
  },
  "namespace": "${namespace}",
  "budget": {
    "cpu": "500m",
    "memory": "192Mi"
  },
  "scope": {
    "cluster_resources": [
      {
        "api_version": "rbac.authorization.k8s.io/v1",
        "kind": "ClusterRole",
        "name": "jk-report-reader"
      },
      {
        "api_version": "rbac.authorization.k8s.io/v1",
        "kind": "ClusterRoleBinding",
        "name": "jk-report-reader"
      }
    ]
  },
  "criteria": [
    {
      "id": "reporter-ready",
      "kind": "ready",
      "points": 1,
      "feedback": "Deployment reporter의 replica 1개가 Ready여야 합니다. ServiceAccount를 바꾼 뒤 새 Pod가 뜨는지 kubectl rollout status로 확인하세요.",
      "target": {
        "api_version": "apps/v1",
        "kind": "Deployment",
        "namespace": "${namespace}",
        "name": "reporter"
      },
      "args": {
        "replicas": 1
      },
      "timeout": "90s"
    },
    {
      "id": "can-read",
      "kind": "authorization",
      "points": 1,
      "feedback": "report-reader는 네임스페이스의 Pod를 get/list/watch하고 ConfigMap report-config를 get할 수 있어야 합니다. Role의 apiGroups, resources, verbs, resourceNames와 RoleBinding의 subjects를 확인하세요. kubectl auth can-i --as=system:serviceaccount:<namespace>:report-reader 로 직접 확인할 수 있습니다.",
      "target": {
        "api_version": "v1",
        "kind": "ServiceAccount",
        "namespace": "${namespace}",
        "name": "report-reader"
      },
      "args": {
        "checks": [
          {
            "verb": "get",
            "resource": "pods",
            "allowed": true
          },
          {
            "verb": "list",
            "resource": "pods",
            "allowed": true
          },
          {
            "verb": "watch",
            "resource": "pods",
            "allowed": true
          },
          {
            "verb": "get",
            "resource": "configmaps",
            "name": "report-config",
            "allowed": true
          }
        ]
      }
    },
    {
      "id": "least-privilege",
      "kind": "authorization",
      "points": 1,
      "feedback": "report-reader는 필요한 권한만 가져야 합니다. Pod 삭제, Secret get/list, Deployment 생성, 모든 네임스페이스 또는 kube-system의 Pod 목록 조회, report-config 이외의 ConfigMap 조회가 허용되면 안 됩니다. edit 같은 넓은 ClusterRole이나 ClusterRoleBinding을 쓰지 말고 이 네임스페이스의 Role과 RoleBinding에 필요한 규칙만 적으세요.",
      "target": {
        "api_version": "v1",
        "kind": "ServiceAccount",
        "namespace": "${namespace}",
        "name": "report-reader"
      },
      "args": {
        "checks": [
          {
            "verb": "delete",
            "resource": "pods",
            "allowed": false
          },
          {
            "verb": "get",
            "resource": "secrets",
            "allowed": false
          },
          {
            "verb": "list",
            "resource": "secrets",
            "allowed": false
          },
          {
            "verb": "create",
            "resource": "deployments",
            "group": "apps",
            "allowed": false
          },
          {
            "verb": "list",
            "resource": "pods",
            "cluster_scope": true,
            "allowed": false
          },
          {
            "verb": "list",
            "resource": "pods",
            "namespace": "kube-system",
            "allowed": false
          },
          {
            "verb": "get",
            "resource": "configmaps",
            "name": "other",
            "allowed": false
          }
        ]
      }
    },
    {
      "id": "runs-as-sa",
      "kind": "authorization",
      "points": 1,
      "feedback": "Deployment reporter의 Pod가 ServiceAccount report-reader로 실행되고 토큰이 마운트되어 있어야 합니다. spec.template.spec.serviceAccountName을 지정하고 automountServiceAccountToken을 끄지 마세요.",
      "target": {
        "api_version": "v1",
        "kind": "ServiceAccount",
        "namespace": "${namespace}",
        "name": "report-reader"
      },
      "args": {
        "checks": [
          {
            "verb": "get",
            "resource": "pods",
            "allowed": true
          }
        ],
        "runs_as": {
          "api_version": "apps/v1",
          "kind": "Deployment",
          "name": "reporter",
          "identity": "token"
        }
      },
      "depends_on": [
        "reporter-ready"
      ]
    },
    {
      "id": "default-sa-unchanged",
      "kind": "authorization",
      "points": 1,
      "feedback": "네임스페이스의 default ServiceAccount는 Pod를 get/list하거나 ConfigMap report-config를 get할 수 없어야 합니다. RoleBinding의 subjects에 default가 들어가 있지 않은지 확인하세요.",
      "target": {
        "api_version": "v1",
        "kind": "ServiceAccount",
        "namespace": "${namespace}",
        "name": "default"
      },
      "args": {
        "checks": [
          {
            "verb": "get",
            "resource": "pods",
            "allowed": false
          },
          {
            "verb": "list",
            "resource": "pods",
            "allowed": false
          },
          {
            "verb": "get",
            "resource": "configmaps",
            "name": "report-config",
            "allowed": false
          }
        ]
      }
    }
  ],
  "setup": [
    {
      "kind": "apply",
      "args": {
        "path": "setup/app.yaml"
      }
    }
  ],
  "solution": [
    {
      "kind": "apply",
      "args": {
        "path": "solution/access.yaml"
      }
    },
    {
      "kind": "apply",
      "args": {
        "path": "solution/reporter.yaml"
      }
    }
  ],
  "initial_expected": {
    "reporter-ready": "PASS",
    "can-read": "FAIL",
    "least-privilege": "FAIL",
    "runs-as-sa": "FAIL",
    "default-sa-unchanged": "PASS"
  },
  "initial_score": 2,
  "cases": [
    {
      "id": "bound-to-default",
      "actions": [
        {
          "kind": "apply",
          "args": {
            "path": "cases/bound-to-default.yaml"
          }
        }
      ],
      "expected": {
        "reporter-ready": "PASS",
        "can-read": "FAIL",
        "least-privilege": "FAIL",
        "runs-as-sa": "FAIL",
        "default-sa-unchanged": "FAIL"
      },
      "expected_score": 1
    },
    {
      "id": "edit-rolebinding",
      "actions": [
        {
          "kind": "apply",
          "args": {
            "path": "cases/edit-rolebinding.yaml"
          }
        },
        {
          "kind": "apply",
          "args": {
            "path": "solution/reporter.yaml"
          }
        }
      ],
      "expected": {
        "reporter-ready": "PASS",
        "can-read": "PASS",
        "least-privilege": "FAIL",
        "runs-as-sa": "PASS",
        "default-sa-unchanged": "PASS"
      },
      "expected_score": 4
    },
    {
      "id": "cluster-wide-binding",
      "actions": [
        {
          "kind": "apply",
          "args": {
            "path": "cases/cluster-wide-binding.yaml"
          }
        },
        {
          "kind": "apply",
          "args": {
            "path": "solution/reporter.yaml"
          }
        }
      ],
      "expected": {
        "reporter-ready": "PASS",
        "can-read": "PASS",
        "least-privilege": "FAIL",
        "runs-as-sa": "PASS",
        "default-sa-unchanged": "PASS"
      },
      "expected_score": 4
    },
    {
      "id": "sa-not-used",
      "actions": [
        {
          "kind": "apply",
          "args": {
            "path": "solution/access.yaml"
          }
        }
      ],
      "expected": {
        "reporter-ready": "PASS",
        "can-read": "PASS",
        "least-privilege": "PASS",
        "runs-as-sa": "FAIL",
        "default-sa-unchanged": "PASS"
      },
      "expected_score": 4
    },
    {
      "id": "alternative-split-roles",
      "actions": [
        {
          "kind": "apply",
          "args": {
            "path": "cases/split-roles.yaml"
          }
        },
        {
          "kind": "apply",
          "args": {
            "path": "solution/reporter.yaml"
          }
        }
      ],
      "expected": {
        "reporter-ready": "PASS",
        "can-read": "PASS",
        "least-privilege": "PASS",
        "runs-as-sa": "PASS",
        "default-sa-unchanged": "PASS"
      },
      "expected_score": 5
    }
  ]
}
