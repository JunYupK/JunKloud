apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.ops.junkloud.dev
spec:
  group: ops.junkloud.dev
  scope: Namespaced
  names:
    plural: backups
    singular: backup
    kind: Backup
    listKind: BackupList
    shortNames:
    - bk
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: Backup asks the platform to back up one workload on a schedule.
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - schedule
            - target
            - retentionDays
            properties:
              schedule:
                type: string
                description: Cron expression for when the backup runs.
              description:
                type: string
                description: Optional free-text note about the backup.
              retentionDays:
                type: integer
                minimum: 1
                maximum: 30
                description: How many days a backup is kept (1 to 30).
              target:
                type: object
                description: The workload to back up.
                required:
                - kind
                - name
                properties:
                  kind:
                    type: string
                    enum:
                    - Deployment
                    - StatefulSet
                  name:
                    type: string
