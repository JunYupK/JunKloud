---
apiVersion: v1
kind: Pod
metadata:
  name: report-worker
  namespace: ${namespace}
  labels:
    app: report-worker
spec:
  containers:
  - name: worker
    image: docker.io/library/busybox:1.37.0
    imagePullPolicy: Never
    command:
    - sh
    - -c
    - 'while :; do :; done'
    resources:
      requests:
        cpu: 5m
        memory: 4Mi
      limits:
        cpu: 200m
        memory: 16Mi
