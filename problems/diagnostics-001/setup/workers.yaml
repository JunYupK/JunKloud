apiVersion: v1
kind: Pod
metadata:
  name: ledger-worker
  namespace: ${namespace}
  labels:
    app: ledger-worker
spec:
  containers:
  - name: worker
    image: docker.io/library/busybox:1.37.0
    imagePullPolicy: Never
    command:
    - sh
    - -c
    - 'sleep 3600'
    resources:
      requests:
        cpu: 5m
        memory: 4Mi
      limits:
        cpu: 50m
        memory: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: audit-worker
