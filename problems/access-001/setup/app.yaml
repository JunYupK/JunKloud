apiVersion: v1
kind: ConfigMap
metadata:
  name: report-config
  namespace: ${namespace}
data:
  interval: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  namespace: ${namespace}
  labels:
    app: reporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
    spec:
      containers:
      - name: reporter
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - sleep 3600
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
