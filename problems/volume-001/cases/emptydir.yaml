{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "ledger",
    "namespace": "${namespace}"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "ledger"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "ledger"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "app",
            "image": "docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e",
            "imagePullPolicy": "Never",
            "command": [
              "sh",
              "-c",
              "sleep 3600"
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "8Mi"
              },
              "limits": {
                "cpu": "75m",
                "memory": "32Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "storage",
                "mountPath": "/data"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "storage",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
