apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: ${namespace}
  annotations:
    example.com/owner: shop-team
spec:
  ingressClassName: cloud-provider-kind
  rules:
  - host: shop.${namespace}.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shop-web
            port:
              name: http
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: shop-api
            port:
              name: http
  - host: api.${namespace}.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shop-api
            port:
              name: http
